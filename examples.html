<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worked problems · Electrostatics Lab</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/viewport.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/teach.css">
  <link rel="stylesheet" href="css/theory.css">
  <link rel="stylesheet" href="css/examples.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/rhythm.css">
  <link rel="stylesheet" href="css/fit.css">
</head>
<body class="lab ex" data-exmode="student">
  <header class="appbar">
    <a class="brand" href="index.html" title="Back to home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="16" r="4.2" class="b-pos"/><circle cx="23" cy="16" r="4.2" class="b-neg"/><path d="M12.5 13.5C16 10 16 10 19.5 13.5M12.5 18.5C16 22 16 22 19.5 18.5M11 12C16 5 16 5 21 12M11 20C16 27 16 27 21 20" class="b-fl"/></svg>
      <span>Electrostatics Lab</span>
    </a>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button type="button" role="tab" data-mode="student">Worked problems</button>
      <button type="button" role="tab" data-mode="teacher">Add problems</button>
      <i class="mode-ink" aria-hidden="true"></i>
    </nav>
    <div class="filemenu">
      <a class="home-btn" href="index.html" title="Home" aria-label="Home"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6M5 8v8.5h3.6v-5h2.8v5H15V8"/></svg><span>Home</span></a>
      <a class="present-btn" href="lab.html?m=1">Model inquiry</a>
    </div>
  </header>
  <div class="ex-work">
    <aside class="ex-left">
      <div class="ex-only-s">
        <div id="exList" class="ex-list"></div>
        <div class="btns"><button type="button" class="btn" id="btnNew">New problem</button><button type="button" class="btn" id="btnEdit">Adapt this problem</button></div>
        <div class="btns"><button type="button" class="btn mini" id="btnImport">Import problem</button><button type="button" class="btn mini" id="btnDel">Delete this problem</button></div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div class="ex-only-t"><ol id="tSteps" class="stepper"></ol><div id="tAssist" class="t-assist"></div></div>
    </aside>
    <main class="view">
      <div id="stage" class="stage">
        <canvas id="gl" aria-label="3D model. Drag to rotate the view and scroll to zoom."></canvas>
        <div class="grain" aria-hidden="true"></div>
        <div id="labels" class="labels" aria-hidden="true"></div>
        <div class="tools" role="toolbar" aria-label="View tools">
          <button type="button" id="btnHome" title="Reset to standard view" aria-label="Reset to standard view">⌂</button>
          <button type="button" id="btnTop" title="Top view" aria-label="Top view">⊤</button>
          <button type="button" id="btnZin" title="Zoom in" aria-label="Zoom in">＋</button>
          <button type="button" id="btnZout" title="Zoom out" aria-label="Zoom out">－</button>
          <button type="button" id="btnFull" title="Toggle full screen" aria-label="Toggle full screen">⛶</button>
        </div>
        <div class="caption" id="caption" aria-live="polite" hidden></div>
        <div class="stagebar"><div class="sb-mid"><span>Show</span></div><div class="sb-layers" id="sbLayers"></div><button type="button" id="btnTheme" class="theme-toggle" title="Switch canvas theme" aria-label="Switch canvas theme">◐</button></div>
      </div>
    </main>
    <aside class="ex-right">
      <div class="ex-only-s" id="exMain"></div>
      <div class="ex-only-t" id="tForm"></div>
    </aside>
  </div>
  <div id="elementStyle" class="element-style glass" hidden></div>
  <script src="js/core/vec.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/tex.js"></script>
  <script src="js/core/motion.js"></script>
  <script src="js/core/vec3d.js"></script>
  <script src="js/physics/field.js"></script>
  <script src="js/physics/fieldlines.js"></script>
  <script src="js/physics/isosurf.js"></script>
  <script src="js/physics/geometry.js"></script>
  <script src="js/render/gl.js"></script>
  <script src="js/render/camera.js"></script>
  <script src="js/render/flow.js"></script>
  <script src="js/render/renderer.js"></script>
  <script src="js/render/draw.js"></script>
  <script src="js/models/common.js"></script>
  <script src="js/models/m03.js"></script>
  <script src="js/models/m08.js"></script>
  <script src="js/app/controls.js"></script>
  <script src="js/ex/templates.js"></script>
  <script src="js/ex/models.js"></script>
  <script src="js/ex/solve.js"></script>
  <script src="js/ex/answers.js"></script>
  <script src="js/ex/builtin.js"></script>
  <script src="js/ex/view.js"></script>
  <script src="js/ex/student.js"></script>
  <script src="js/ex/teacher.js"></script>
  <script src="js/ex/app.js"></script>
  <script src="js/audit.js"></script>
</body>
</html>
